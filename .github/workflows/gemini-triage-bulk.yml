name: "📋 Gemini Bulk Triage"

on:
    workflow_call:
        inputs:
            issues_to_triage:
                type: "string"
                description: "JSON array of issues to triage"
                required: true
            additional_context:
                type: "string"
                description: "Any additional context from the request"
                required: false
            language:
                type: "string"
                description: "Response language (default: 'ja' — JP)."
                default: "ja"
            gemini_model:
                type: "string"
                description: "Gemini model override"
                required: false
                default: ""
        outputs:
          available_labels:
            description: "List of available labels"
            value: ${{ jobs.triage_bulk.outputs.available_labels }}
          triaged_issues:
            description: "JSON string of triaged issues"
            value: ${{ jobs.triage_bulk.outputs.triaged_issues }}
        secrets:
          GEMINI_API_KEY:
            required: true

defaults:
    run:
        shell: "bash"

jobs:
    triage_bulk:
        runs-on: "ubuntu-latest"
        timeout-minutes: 5
        permissions:
          contents: "read"
          issues: "read"
          pull-requests: "read"
        outputs:
            available_labels: "${{ steps.get_labels.outputs.available_labels }}"
            triaged_issues: "${{ steps.collect_outputs.outputs.triaged_issues }}"
        steps:
            - name: "Get repository labels"
              id: "get_labels"
              uses: "actions/github-script@v9"
              with:
                  script: |-
                      const { data: labels } = await github.rest.issues.listLabelsForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                      });

                      if (!labels || labels.length === 0) {
                        core.setFailed('There are no issue labels in this repository.')
                      }

                      const labelNames = labels.map(label => label.name).sort();
                      core.setOutput('available_labels', labelNames.join(','));
                      core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
                      return labelNames;

            - name: "Run Gemini Issue Analysis (bulk)"
              id: "gemini_issue_analysis"
              uses: "google-github-actions/run-gemini-cli@v0" # ratchet:exclude
              env:
                  GEMINI_CLI_TRUST_WORKSPACE: "true"
                  GITHUB_TOKEN: "${{ github.token }}"
                  ISSUES_TO_TRIAGE: "${{ inputs.issues_to_triage }}"
                  REPOSITORY: "${{ github.repository }}"
                  AVAILABLE_LABELS: "${{ steps.get_labels.outputs.available_labels }}"
                  GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
              with:
                  # No GCP fields - using API key only
                  gemini_api_key: "${{ secrets.GEMINI_API_KEY }}"
                  gemini_model: "${{ inputs.gemini_model || vars.GEMINI_MODEL || '' }}"
                  settings: |-
                      {
                        "model": {
                          "maxSessionTurns": 25
                        },
                        "telemetry": {
                          "enabled": false
                        }
                      }
                  prompt: |-
                      出力は必ず日本語で行ってください。
                      応答言語: ${{ inputs.language }}
                      
                      ## Role
                      You are a highly efficient Issue Triage Engineer. Your task is to analyze the provided GitHub issues and assign the most relevant labels from the available list.

                      ## Input Data
                      
                      **Available Labels:**
                      ${{ steps.get_labels.outputs.available_labels }}

                      **Issues to Triage (JSON):**
                      ${{ inputs.issues_to_triage }}

                      ## Primary Directive
                      Analyze the issues above and generate a JSON array containing your triage decisions.

                      Target File Path: /tmp/triaged_issues.json

                      Output Format (JSON Array):
                      [
                        {
                          "issue_number": <number>,
                          "labels_to_set": ["<label1>", "<label2>"],
                          "explanation": "<brief explanation in Japanese>"
                        }
                      ]

                      ## Strict Output Rules
                      Output the JSON array directly in your response. Ensure the output is strictly valid JSON format, without markdown formatting if possible. Warning: Do not use example data. Output the actual analysis results for the issues provided above.

            - name: "Collect outputs"
              id: "collect_outputs"
              uses: "actions/github-script@v9"
              env:
                  GEMINI_RESPONSE: "${{ steps.gemini_issue_analysis.outputs.summary }}"
              with:
                  script: |-
                      let triagedIssues = '[]';
                      const response = process.env.GEMINI_RESPONSE || '';
                      
                      try {
                        let jsonStr = response.trim();
                        const jsonMatch = response.match(/```json\s*([\s\S]*?)\s*```/);
                        if (jsonMatch) {
                          jsonStr = jsonMatch[1];
                        } else {
                          const anyMatch = response.match(/```\s*([\s\S]*?)\s*```/);
                          if (anyMatch) {
                            jsonStr = anyMatch[1];
                          } else {
                            // Extract JSON array literal with a fallback regex
                            const arrayMatch = response.match(/\[[\s\S]*\]/);
                            if (arrayMatch) {
                              jsonStr = arrayMatch[0];
                            }
                          }
                        }

                        console.log('Extracted content preview:', jsonStr.substring(0, 100));
                        const parsed = JSON.parse(jsonStr);
                        if (!Array.isArray(parsed)) {
                          throw new Error("Parsed JSON is not an array");
                        }
                        triagedIssues = jsonStr;
                      } catch (error) {
                        core.warning(`Error parsing triaged issues from Gemini response: ${error.message}`);
                        const trimmedResponse = response.trim();
                        const previewLength = 500;
                        const responsePreview = trimmedResponse.slice(0, previewLength);
                        const isTruncated = trimmedResponse.length > previewLength;
                        core.info(`Gemini response parse failure metadata: length=${response.length}, trimmedLength=${trimmedResponse.length}, previewLength=${responsePreview.length}, truncated=${isTruncated}`);
                        core.info(`Gemini response preview (first ${previewLength} chars): ${responsePreview}`);
                      }
                      
                      core.setOutput('triaged_issues', triagedIssues);
