<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        width: 200px;
        padding: 10px;
        font-family: sans-serif;
      }
      .control-group {
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Audicle</h1>
    <div class="control-group">
      <label for="toggle-switch">読み上げモード</label>
      <label class="switch">
        <input type="checkbox" id="toggle-switch" />
        <span class="slider round"></span>
      </label>
    </div>
    <div class="control-group">
      <label for="playback-rate"
        >再生速度: <span id="playback-rate-value">1.0</span>x</label
      >
      <input
        type="range"
        id="playback-rate"
        min="0.8"
        max="3.0"
        step="0.1"
        value="1.0"
      />
    </div>
    <div class="control-group">
      <button id="pause-resume-btn">一時停止</button>
    </div>
    <div class="auth-group">
      <div id="auth-status">Audicle 未ログイン</div>
      <button type="button" id="audicle-login-btn">Audicle にログイン</button>
      <button type="button" id="audicle-logout-btn" style="display: none">ログアウト</button>
      <small class="auth-note"
        >表示中ページ本文を Audicle API へ送信して音声化します。</small
      >
    </div>
    <script src="popup.js"></script>
  </body>
</html>
